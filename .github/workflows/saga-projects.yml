name: Saga projects build

on:
  push:
    branches: [main]
    paths:
      - 'saga-temporal-java/**'
      - 'saga-camunda-java/**'
      - '.github/workflows/saga-projects.yml'
  pull_request:
    paths:
      - 'saga-temporal-java/**'
      - 'saga-camunda-java/**'
      - '.github/workflows/saga-projects.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - saga-temporal-java
          - saga-camunda-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress -f ${{ matrix.project }}/pom.xml verify
