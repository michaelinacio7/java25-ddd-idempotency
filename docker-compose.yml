services:
  postgres:
    image: postgres:16
    container_name: java25-ddd-idempotency-postgres
    environment:
      POSTGRES_DB: bankpayments
      POSTGRES_USER: bankpayments
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankpayments -d bankpayments"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - bankpayments_data:/var/lib/postgresql/data

volumes:
  bankpayments_data:
